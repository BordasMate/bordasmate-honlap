<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Szerkesztő — Bordás Máté</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Szerkesztő</span>
      <span id="dirty" class="dirty" hidden>mentetlen változások</span>
    </div>
    <div class="bar-actions">
      <button id="btn-glitch" class="ghost" title="Egy teljes képes glitch az előnézetben">Glitch próba</button>
      <button id="btn-download" class="ghost" title="A tartalom letöltése content.json fájlként">Letöltés</button>
      <label class="ghost file-btn" title="Korábban letöltött content.json betöltése">Betöltés<input id="file-import" type="file" accept="application/json,.json" hidden></label>
      <button id="btn-revert" class="ghost" title="A honlapon levő változat visszatöltése">Elvetés</button>
      <button id="btn-history" class="ghost" title="Korábbi mentések">Előzmények</button>
      <button id="btn-logout" class="ghost" title="Kilépés (a jelszó elfelejtése ezen a gépen)">Kilépés</button>
      <button id="btn-save" class="primary" title="Mentés a honlapra (Ctrl+S)">Mentés</button>
    </div>
  </header>

  <main class="layout">
    <aside class="side">
      <nav class="tabs" role="tablist">
        <button role="tab" data-tab="content" class="tab active">Tartalom</button>
        <button role="tab" data-tab="look" class="tab">Megjelenés</button>
        <button role="tab" data-tab="site" class="tab">Oldal</button>
      </nav>
      <div id="tree" class="tree"></div>
    </aside>

    <section class="editor" id="editor" aria-live="polite"></section>

    <section class="preview">
      <div class="preview-bar">
        <span class="preview-label">Élő előnézet</span>
        <code id="preview-path">/</code>
        <a id="preview-open" href="/" target="_blank" rel="noopener" class="preview-link">a honlap ↗</a>
      </div>
      <iframe id="preview" src="/?preview" title="A honlap élő előnézete"></iframe>
    </section>
  </main>

  <dialog id="login-dialog">
    <form method="dialog" class="dialog">
      <h2>Belépés</h2>
      <p class="hint">A mentéshez add meg a szerkesztő jelszavát (a Netlify-on beállított <code>ADMIN_PASSWORD</code>).</p>
      <p id="login-msg" class="hint warn" hidden></p>
      <label>Jelszó <input name="pass" type="password" autocomplete="current-password" required></label>
      <label class="check"><input name="remember" type="checkbox"> Megjegyzés ezen a gépen</label>
      <div class="dialog-actions">
        <button value="cancel" class="ghost" formnovalidate>Mégse</button>
        <button value="ok" class="primary">Belépés</button>
      </div>
    </form>
  </dialog>

  <dialog id="history-dialog">
    <div class="dialog">
      <h2>Korábbi mentések</h2>
      <p class="hint">Az utolsó 40 mentés. Egy változat betöltése után a <b>Mentés</b> gombbal teheted újra élővé.</p>
      <div id="history-list" class="list"></div>
      <div class="dialog-actions"><button class="ghost" onclick="this.closest('dialog').close()">Bezárás</button></div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
