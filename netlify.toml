# Nincs build lépés: a gyökérkönyvtár tartalma közvetlenül kikerül.
[build]
  publish = "."
  command = ""

# Minden ismeretlen útvonalat (pl. /irodalom/vers) az index.html szolgál ki,
# a megfelelő oldalt a böngészőben futó kód rajzolja ki.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# a szerkesztő mentései (Netlify Function + Blobs)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# a szerkesztő (admin felület) saját oldala
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "no-cache"
